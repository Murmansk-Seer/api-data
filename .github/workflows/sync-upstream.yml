name: Sync Upstream
'on':
  schedule:
  - cron: 16 * * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare without pushing
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sync:
    uses: Murmansk-Seer/.github/.github/workflows/sync-identical-reusable.yml@688cca34f62b5c8efbc3482b92ea1afdc6675d26
    with:
      implementation_ref: 688cca34f62b5c8efbc3482b92ea1afdc6675d26
      dry_run: ${{ inputs.dry_run == true }}
