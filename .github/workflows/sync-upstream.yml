name: Sync Upstream

on:
  schedule:
    - cron: "10 19 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SeerAPI/api-data.git || git remote set-url upstream https://github.com/SeerAPI/api-data.git
          git fetch upstream main
          base_head="$(git rev-parse HEAD)"

          restore_workflows() {
            if git diff --quiet "$base_head" -- .github/workflows; then
              return 0
            fi
            echo "Keeping fork workflow files; upstream workflow updates require workflow-scoped tokens."
            git checkout "$base_head" -- .github/workflows
            git add .github/workflows
          }

          if git merge -X theirs -m "Sync upstream api-data 同步上游数据源" upstream/main; then
            restore_workflows
            if [ "$(git rev-parse HEAD)" = "$base_head" ] && git diff --cached --quiet && git diff --quiet; then
              echo "Already up to date."
              exit 0
            fi
            if ! git diff --cached --quiet || ! git diff --quiet; then
              git commit --amend --no-edit
            fi
            git push origin main
            exit 0
          fi

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -z "$conflicts" ]; then
            echo "Merge failed without unresolved file conflicts."
            git status --short
            exit 1
          fi

          echo "$conflicts" | while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Taking upstream version for conflicted file: $file"
            if git checkout --theirs -- "$file" 2>/dev/null; then
              git add -- "$file"
            else
              git rm -f --ignore-unmatch -- "$file"
            fi
          done

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          restore_workflows
          git commit --no-edit
          git push origin main
