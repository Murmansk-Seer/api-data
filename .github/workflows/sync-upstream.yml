name: Sync Upstream
'on':
  schedule:
  - cron: 16 * * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare without pushing
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sync:
    uses: Murmansk-Seer/.github/.github/workflows/sync-identical-reusable.yml@822429c0b88b018d85823ca27a2607b2546d42df
    with:
      implementation_ref: 822429c0b88b018d85823ca27a2607b2546d42df
      dry_run: ${{ inputs.dry_run == true }}
