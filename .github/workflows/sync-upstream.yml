name: Sync Upstream
'on':
  schedule:
  - cron: 16 * * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare without pushing
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sync:
    uses: Murmansk-Seer/.github/.github/workflows/sync-identical-reusable.yml@4cd1383f6dfe47e0a92072c687ab32dce130753c
    with:
      implementation_ref: 4cd1383f6dfe47e0a92072c687ab32dce130753c
      dry_run: ${{ inputs.dry_run == true }}
