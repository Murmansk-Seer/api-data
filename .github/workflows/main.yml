name: Auto Update Config

permissions:
    contents: write

on:
    push:
        branches: [main]
        paths: ['.github/workflows/main.yml', 'scripts/**', 'tests/**']
    workflow_dispatch:
        inputs:
            force:
                type: boolean
                description: "Force rebuild even when config-sources and patch-sources are unchanged"
                required: false
                default: false
            debug_enabled:
                type: boolean
                description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
                required: false
                default: false

    repository_dispatch:
        types: [config-source-update, patch-source-update]

    schedule:
        - cron: "17 */6 * * *"

concurrency:
    group: api-data-build
    cancel-in-progress: false

jobs:
    main:
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.verify.outcome == 'success' }}
            source: ${{ steps.source_check.outputs.config_head }}
            parser: 7815b7e47f9fcec17f9c133d6778aebd565c9c0c
            dispatch: ${{ steps.dispatch.outcome }}
            analysis: ${{ steps.analyze.outcome }}
            upload: ${{ steps.upload.outcome }}
        env:
            SOLARIS_API_VERSION: v1
            SOLARIS_API_URL: https://api.seerapi.com
            SOLARIS_DATA_SOURCE: https://github.com/Murmansk-Seer/config-sources.git
            SOLARIS_PATCH_SOURCE: https://github.com/Murmansk-Seer/patch-sources.git
            BASE_OUTPUT_DIR: data
            HAS_BLOB_CONFIG: ${{ secrets.BLOB_TOKEN != '' && secrets.BLOB_PROJECT_ID != '' && secrets.BLOB_STORE_NAME != '' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  # Resolve the branch when the queued job starts, not its old event SHA.
                  ref: ${{ github.event.repository.default_branch }}

            - name: Record checked-out build revision
              run: echo "BUILD_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

            - name: Check data source changes
              id: source_check
              env:
                  FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
              run: |
                  set -e
                  config_head="$(git ls-remote "${SOLARIS_DATA_SOURCE}" HEAD | awk '{print $1}')"
                  patch_head="$(git ls-remote "${SOLARIS_PATCH_SOURCE}" HEAD | awk '{print $1}')"
                  test -n "$config_head" && test -n "$patch_head"
                  CONFIG_HEAD="$config_head" PATCH_HEAD="$patch_head" python3 scripts/publication_state.py check

            - name: Skip unchanged build
              if: steps.source_check.outputs.skip == 'true'
              run: echo "No config-sources or patch-sources changes; workflow succeeded without rebuilding."

            - name: Set up Python
              if: steps.source_check.outputs.skip != 'true'
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Set up uv
              if: steps.source_check.outputs.skip != 'true'
              uses: astral-sh/setup-uv@v7

            - name: Install solaris
              if: steps.source_check.outputs.skip != 'true'
              # Pin the merged Solaris timezone and analyzer fixes used for data generation.
              run: uv tool install --force 'seerapi-solaris @ git+https://github.com/Murmansk-Seer/seerapi.git@7815b7e47f9fcec17f9c133d6778aebd565c9c0c#subdirectory=packages/solaris'

            - name: Setup tmate session
              if: ${{ steps.source_check.outputs.skip != 'true' && github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
              uses: mxschmitt/action-tmate@v3

            - name: Clone config sources
              if: steps.source_check.outputs.skip != 'true'
              run: |
                  git clone ${{ env.SOLARIS_DATA_SOURCE }} source
                  git clone ${{ env.SOLARIS_PATCH_SOURCE }} patch-sources
                  git -C source checkout --detach ${{ steps.source_check.outputs.config_head }}
                  git -C patch-sources checkout --detach ${{ steps.source_check.outputs.patch_head }}
                  mkdir -p source/patch
                  mv patch-sources/patches/* source/patch

            - name: Patch Unity-only skills missing Flash rows
              if: steps.source_check.outputs.skip != 'true'
              run: python scripts/patch_unity_only_skills.py source

            - name: Analyze config
              id: analyze
              if: steps.source_check.outputs.skip != 'true'
              run: |
                  solaris analyze data --base-output-dir ${{ env.BASE_OUTPUT_DIR }} -o data --json-format split \
                  --base-json-url https://api.seerapi.com/v1 \
                  --db-url sqlite:///seerapi-data.sqlite \
                  -m all --output-named-data

                  solaris analyze data --base-output-dir ${{ env.BASE_OUTPUT_DIR }} -o sharded_data --json-format sharded \
                  --base-json-url https://api.seerapi.com/v1 \
                  -m json --output-named-data

                  solaris analyze schemas --base-output-dir ${{ env.BASE_OUTPUT_DIR }} -o schemas \
                  --base-url https://api.seerapi.com/v1/schemas --output-named-data

                  openapi_desc=$(cat .github/workflows/openapi-desc.md)
                  detail_version="1.0.0"
                  solaris analyze openapi --base-output-dir ${{ env.BASE_OUTPUT_DIR }} -o openapi.json \
                  --description "$openapi_desc" --detail-version "$detail_version" --output-named-data

            - name: Commit and push changes
              if: steps.source_check.outputs.skip != 'true'
              id: commit
              env:
                  BUILD_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  python3 scripts/publication_state.py validate
                  git add data
                  timestamp=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')
                  git diff --staged --quiet || git commit -m "Auto update config $timestamp"
                  python scripts/push_build.py --base "$BUILD_BASE" --branch "$BUILD_BRANCH"
                  echo "DATA_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
                  echo "timestamp=$timestamp" >> $GITHUB_OUTPUT

            - name: Generate database checksum
              if: steps.source_check.outputs.skip != 'true'
              id: db_checksum
              run: |
                  checksum="$(sha256sum seerapi-data.sqlite)"
                  printf '%s\n' "${checksum}" > seerapi-data.sqlite.sha256
                  sha256="${checksum%% *}"
                  echo "=== 数据库文件 SHA256 校验和 ==="
                  cat seerapi-data.sqlite.sha256
                  echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

            - name: Upload database to release
              id: upload
              if: steps.source_check.outputs.skip != 'true'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: latest
                  name: Data Update - ${{ steps.commit.outputs.timestamp }}
                  body: |
                      最新的 SeerAPI 数据库
                      更新时间: ${{ steps.commit.outputs.timestamp }}
                      SHA256 校验和: ${{ steps.db_checksum.outputs.sha256 }}
                      **注意，该效验和仅用于验证数据库文件的完整性，不能用于验证数据库内容是否有更新**
                  files: |
                      seerapi-data.sqlite
                      seerapi-data.sqlite.sha256
                  token: ${{ secrets.GITHUB_TOKEN }}
                  prerelease: false
                  draft: false
                  make_latest: true
                  overwrite_files: true
                  fail_on_unmatched_files: true

            - name: Verify published database and checksum
              id: verify
              if: steps.source_check.outputs.skip != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  DB_SHA: ${{ steps.db_checksum.outputs.sha256 }}
              run: python3 scripts/publication_state.py verify

            - name: Record verified publication
              if: steps.verify.outcome == 'success'
              env:
                  CONFIG_HEAD: ${{ steps.source_check.outputs.config_head }}
                  PATCH_HEAD: ${{ steps.source_check.outputs.patch_head }}
                  BUILD_FINGERPRINT: ${{ steps.source_check.outputs.fingerprint }}
                  DB_SHA: ${{ steps.db_checksum.outputs.sha256 }}
              run: |
                  base=$(git rev-parse HEAD)
                  python3 scripts/publication_state.py record
                  git add .build-state
                  git commit -m "Record verified api-data publication"
                  python3 scripts/push_build.py --base "$base" --branch main

            - name: Trigger SeerAPI build
              id: dispatch
              if: success() && (steps.verify.outcome == 'success' || steps.source_check.outputs.notify == 'true')
              env:
                  GH_TOKEN: ${{ secrets.SEERAPI_DISPATCH_TOKEN }}
                  DB_SHA: ${{ steps.db_checksum.outputs.sha256 || steps.source_check.outputs.published_sha }}
                  SOURCE_COMMIT: ${{ env.DATA_COMMIT || steps.source_check.outputs.published_commit }}
              run: |
                  set -euo pipefail
                  if [ -z "${GH_TOKEN:-}" ]; then
                      echo "::error::SEERAPI_DISPATCH_TOKEN is required to notify Murmansk-Seer/seerapi after publishing api-data."
                      exit 1
                  fi
                  if ! [[ "${DB_SHA}" =~ ^[0-9a-f]{64}$ ]]; then
                      echo "::error::Generated api-data SHA256 is invalid: ${DB_SHA}"
                      exit 1
                  fi
                  gh api --method POST repos/Murmansk-Seer/seerapi/dispatches \
                      -f event_type=api-data-published \
                      -f "client_payload[sha256]=${DB_SHA}" \
                      -f "client_payload[source_commit]=${SOURCE_COMMIT}"

            - name: Record successful downstream notification
              if: steps.dispatch.outcome == 'success'
              run: |
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git config user.name "github-actions[bot]"
                  base=$(git rev-parse HEAD)
                  python3 scripts/publication_state.py ack
                  git add .build-state/notified-fingerprint
                  git diff --staged --quiet || git commit -m "Record SeerAPI notification receipt"
                  python3 scripts/push_build.py --base "$base" --branch main

            # - name: Push to cnb.cool Git Repository
            #   run: |
            #     # 配置 cnb.cool 远程仓库
            #     git remote add cnb https://cnb:${{ secrets.CNB_TOKEN }}@cnb.cool/${{ secrets.CNB_REPO_PATH }}.git || true
            #     git remote set-url cnb https://cnb:${{ secrets.CNB_TOKEN }}@cnb.cool/${{ secrets.CNB_REPO_PATH }}.git

            #     # 推送到 cnb.cool 仓库
            #     git push cnb main --force

            - name: Set up Node.js
              if: steps.source_check.outputs.skip != 'true' && env.HAS_BLOB_CONFIG == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - name: Install Node dependencies
              if: steps.source_check.outputs.skip != 'true' && env.HAS_BLOB_CONFIG == 'true'
              run: npm ci

            - name: Upload data to blob
              if: steps.source_check.outputs.skip != 'true' && env.HAS_BLOB_CONFIG == 'true'
              continue-on-error: true
              env:
                  BLOB_TOKEN: ${{ secrets.BLOB_TOKEN }}
                  BLOB_PROJECT_ID: ${{ secrets.BLOB_PROJECT_ID }}
                  BLOB_STORE_NAME: ${{ secrets.BLOB_STORE_NAME }}
              run: |
                  npx tsx upload_data_to_blob.ts data/v1/schemas/ --store seerapi-v1 --prefix schemas/
                  npx tsx upload_data_to_blob.ts data/v1/sharded_data/ --store seerapi-v1 --prefix sharded_data/

            - name: Skip blob upload
              if: steps.source_check.outputs.skip != 'true' && env.HAS_BLOB_CONFIG != 'true'
              run: echo "Blob secrets are not configured; GitHub Release assets have already been published."

    report:
        if: ${{ always() }}
        needs: main
        runs-on: ubuntu-latest
        outputs:
            label: ${{ steps.report.outputs.label }}
            failed: ${{ steps.report.outputs.failed }}
        steps:
            - id: report
              uses: Murmansk-Seer/.github/.github/actions/report-update@dadd404c9c0119e0326e1e4fb8fcdf3ef6330dab
              env:
                  GH_TOKEN: ${{ github.token }}
              with:
                  jobs: ${{ toJSON(needs) }}
                  release-tag: latest
                  evidence: '{"published":"${{ needs.main.outputs.published }}","source":"${{ needs.main.outputs.source }}","parser":"${{ needs.main.outputs.parser }}","analysis":"${{ needs.main.outputs.analysis }}","upload":"${{ needs.main.outputs.upload }}","dispatch":"${{ needs.main.outputs.dispatch }}"}'
    result:
        if: ${{ always() }}
        needs: report
        name: ${{ needs.report.outputs.label || '失败 · 状态报告未完成' }}
        runs-on: ubuntu-latest
        steps:
            - env:
                  FAILED: ${{ needs.report.outputs.failed }}
                  REPORT_RESULT: ${{ needs.report.result }}
              run: test "$FAILED" != true && test "$REPORT_RESULT" = success
